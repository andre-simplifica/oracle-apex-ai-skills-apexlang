name: Validate kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/apexlang-validation"
          "$RUNNER_TEMP/apexlang-validation/bin/pip" install -r requirements-dev.txt
      - name: Validate offline workflows and references
        run: |
          source "$RUNNER_TEMP/apexlang-validation/bin/activate"
          bash scripts/validate_repo.sh
